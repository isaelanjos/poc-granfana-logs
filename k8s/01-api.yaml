apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-vet
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-vet
  template:
    metadata:
      labels:
        app: api-vet
    spec:
      containers:
        - name: api-vet
          image: api-vet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-vet
  namespace: observability
spec:
  selector:
    app: api-vet
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
