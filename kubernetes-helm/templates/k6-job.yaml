{{- $ns := .Values.namespace -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: {{ $ns }}
data:
  load.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 10,
      duration: '2m',
      thresholds: {
        http_req_failed: ['rate<0.3'],
        http_req_duration: ['p(95)<500'],
      },
    };

    export default function () {
      const params = {
        headers: {
          'Host': 'api.local',
          'Content-Type': 'application/json',
        },
      };

      const baseUrl = 'http://traefik.kube-system.svc.cluster.local';

      const health = http.get(baseUrl + '/health', params);
      check(health, { 'health ok': (r) => r.status === 200 });

      const pets = http.get(baseUrl + '/pets', params);
      check(pets, { 'pets ok': (r) => r.status === 200 });

      const pet = http.get(baseUrl + '/pets/1', params);
      check(pet, { 'pet ok': (r) => r.status === 200 });

      const missing = http.get(baseUrl + '/pets/999', params);
      check(missing, { 'pet not found': (r) => r.status === 404 });

      sleep(0.5);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-load-test
  namespace: {{ $ns }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: api-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          command: ["k6", "run", "/scripts/load.js"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-script
