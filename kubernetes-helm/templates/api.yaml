{{- $ns := .Values.namespace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-vet
  namespace: {{ $ns }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api-vet
  template:
    metadata:
      labels:
        app: api-vet
    spec:
      containers:
        - name: api-vet
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-vet
  namespace: {{ $ns }}
spec:
  selector:
    app: api-vet
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.port }}
  type: ClusterIP
