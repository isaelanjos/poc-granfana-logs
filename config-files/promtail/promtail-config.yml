server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api-vet
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /?api-vet-promtail
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: /?(.*)
      - target_label: service
        replacement: api-vet
      - target_label: environment
        replacement: dev
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            service: service
      - labels:
          service:
          environment:
          container:

