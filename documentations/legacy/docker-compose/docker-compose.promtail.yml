services:
  api:
    build: .
    container_name: api-vet-promtail
    ports:
      - "8000:8000"
    networks: [observability]

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail-api-vet
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../../config-files/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [api, loki]
    networks: [observability]

  loki:
    image: grafana/loki:2.9.3
    container_name: loki-api-vet-promtail
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../../config-files/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-promtail-data:/loki
    networks: [observability]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana-api-vet-promtail
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api-vet-loki.json
    volumes:
      - ../../config-files/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../config-files/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-promtail-data:/var/lib/grafana
    depends_on: [loki]
    networks: [observability]

volumes:
  loki-promtail-data:
  grafana-promtail-data:

networks:
  observability:
